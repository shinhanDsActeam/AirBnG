name: CI/CD for AirBnG

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/airbng .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/airbng

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker stop airbng-container || true
            docker rm airbng-container || true

            echo "DB_DEV_HOST=${{ secrets.DB_DEV_HOST }}" > /home/ubuntu/.env
            echo "DB_DEV_USERNAME=${{ secrets.DB_DEV_USERNAME }}" >> /home/ubuntu/.env
            echo "DB_DEV_PASSWD=${{ secrets.DB_DEV_PASSWD }}" >> /home/ubuntu/.env
            echo "AWS_ACCESSKEY=${{ secrets.AWS_ACCESSKEY }}" >> /home/ubuntu/.env
            echo "AWS_SECRETKEY=${{ secrets.AWS_SECRETKEY }}" >> /home/ubuntu/.env
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> /home/ubuntu/.env
            echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> /home/ubuntu/.env
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> /home/ubuntu/.env
            echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> /home/ubuntu/.env
            echo "REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}" >> /home/ubuntu/.env
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> /home/ubuntu/.env
            echo "PROFILE=dev" >> /home/ubuntu/.env

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/airbng

            docker run -d --name airbng-container \
              --env-file /home/ubuntu/.env \
              -p 9000:9000 \
              -p 6379:6379 \
              ${{ secrets.DOCKERHUB_USERNAME }}/airbng

      - name: Notify Discord on success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"✅ [배포 성공] 성공적으로 배포\"}" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"❌ [배포 실패] 배포 중 오류\"}" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}